name: Build v2ray dat files
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "LICENSE*"
      - "*.md"

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      TAG_NAME: latest
      RELEASE_NAME: latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build geoip.dat
        run: |
          mkdir -p ./tmp ./release
          jq '{
            input: (
              (.geoip | to_entries | map(.key as $name | .value[] | {
                type: "json",
                action: "add",
                args: { name: $name, uri: ., jsonPath: ["data.prefixes.#.prefix"] }
              }))
              +
              ((.geoip_import // []) | map({
                type: "v2rayGeoIPDat",
                action: "add",
                args: { uri: .uri, wantedList: .wantedList }
              }))
              +
              [{ type: "private", action: "add" }]
            ),
            output: [{
              type: "v2rayGeoIPDat",
              action: "output",
              args: { outputName: "geoip.dat", outputDir: "./release" }
            }]
          }' ./config.json > ./tmp/geoip-config.json
          go run github.com/Loyalsoldier/geoip@latest convert -c ./tmp/geoip-config.json

      - name: Generate checksums
        run: |
          cd ./release
          for f in *.dat; do
            sha256sum "${f}" > "${f}.sha256sum"
          done

      - name: Remove existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release delete "${TAG_NAME}" --yes
          fi

          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" >/dev/null 2>&1; then
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}"
          fi

      - name: Upload files to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          overwrite: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: ./release/*
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}
